<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMM Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #18181f;
      --border: #2a2a35;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    /* Header */
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem;
    }
    .logo { font-family: var(--font-head); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; }
    .logo span { color: var(--accent); }
    .badge-live {
      background: var(--accent3); color: #000; font-size: 0.65rem;
      font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.1em;
    }

    /* Login box */
    #login-section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 2.5rem; text-align: center;
      max-width: 420px; margin: 6rem auto;
    }
    #login-section h2 { font-family: var(--font-head); font-size: 1.4rem; margin-bottom: 0.5rem; }
    #login-section p { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; }

    /* Cards */
    .card-custom {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .card-custom h5 {
      font-family: var(--font-head); font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--muted); margin-bottom: 1rem;
    }

    /* Balance widget */
    .balance-display {
      font-family: var(--font-head); font-size: 2.8rem; font-weight: 800;
      color: var(--accent); letter-spacing: -0.04em; line-height: 1;
    }
    .balance-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

    /* Form inputs */
    .form-control, .form-select {
      background: var(--surface) !important; border: 1px solid var(--border) !important;
      color: var(--text) !important; border-radius: 8px; font-family: var(--font-mono);
      font-size: 0.85rem; padding: 0.65rem 1rem;
    }
    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 2px rgba(108,99,255,0.3) !important; border-color: var(--accent) !important;
    }
    .form-control::placeholder { color: var(--muted) !important; }
    .form-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }

    /* Buttons */
    .btn-primary-custom {
      background: var(--accent); border: none; color: #fff; font-family: var(--font-mono);
      font-size: 0.85rem; font-weight: 700; padding: 0.65rem 1.5rem;
      border-radius: 8px; cursor: pointer; transition: opacity 0.15s, transform 0.15s;
      display: inline-block;
    }
    .btn-primary-custom:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary-custom:active { transform: translateY(0); }
    .btn-sm-custom {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: var(--font-mono); font-size: 0.75rem; padding: 0.35rem 0.85rem;
      border-radius: 6px; cursor: pointer; transition: all 0.15s;
    }
    .btn-sm-custom:hover { border-color: var(--accent); color: var(--accent); }

    /* Orders table */
    .orders-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.8rem; }
    .orders-table th {
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
      font-size: 0.7rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
      font-weight: 400;
    }
    .orders-table td { padding: 0.75rem; border-bottom: 1px solid rgba(42,42,53,0.5); vertical-align: middle; }
    .orders-table tr:last-child td { border-bottom: none; }
    .orders-table tr:hover td { background: rgba(108,99,255,0.04); }

    .link-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

    /* Status badges */
    .status-badge {
      font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .status-pending  { background: rgba(255,193,7,0.15);  color: #ffc107; }
    .status-inprogress { background: rgba(108,99,255,0.15); color: var(--accent); }
    .status-completed  { background: rgba(67,233,123,0.15); color: var(--accent3); }
    .status-partial    { background: rgba(255,107,107,0.2); color: var(--accent2); }
    .status-default    { background: rgba(107,107,128,0.2); color: var(--muted); }

    /* Alert */
    .alert-custom {
      border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem;
      margin-top: 0.75rem; display: none;
    }
    .alert-success { background: rgba(67,233,123,0.1); border: 1px solid rgba(67,233,123,0.3); color: var(--accent3); }
    .alert-danger  { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--accent2); }

    /* User chip */
    .user-chip {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 30px; padding: 4px 12px 4px 6px; font-size: 0.75rem;
    }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent3); }

    /* Grid layout */
    .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media(max-width: 600px) { .top-row { grid-template-columns: 1fr; } }

    /* Loading spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fade in */
    .fade-in { animation: fadeIn 0.35s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    #dashboard { display: none; }
    .section-title { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .empty-state { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="logo">SMM<span>Panel</span></div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <span class="badge-live">LIVE</span>
      <div id="user-chip" style="display:none;" class="user-chip">
        <div class="user-dot"></div>
        <span id="chip-uid">—</span>
      </div>
      <button class="btn-sm-custom" id="logout-btn" style="display:none;" onclick="logout()">Exit</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login-section">
    <h2>Enter Your User ID</h2>
    <p>No account needed — just enter any unique ID to get started.</p>
    <div style="margin-bottom:1rem;">
      <input type="text" id="login-uid" class="form-control" placeholder="e.g. john_doe_42" />
    </div>
    <button class="btn-primary-custom w-100" onclick="doLogin()">Enter Panel</button>
    <div id="login-alert" class="alert-custom alert-danger"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="fade-in">

    <!-- Balance + Quick Recharge row -->
    <div class="top-row">
      <div class="card-custom">
        <h5>Wallet Balance</h5>
        <div class="balance-display" id="balance-val">—</div>
        <div class="balance-label">available credits</div>
        <hr class="divider"/>
        <button class="btn-sm-custom" onclick="refreshBalance()">↻ Refresh</button>
      </div>
      <div class="card-custom">
        <h5>Admin: Add Balance</h5>
        <p style="font-size:0.75rem;color:var(--muted);margin-bottom:0.75rem;">Requires admin token</p>
        <label class="form-label">Admin Token</label>
        <input type="password" id="admin-token" class="form-control" placeholder="••••••••" style="margin-bottom:0.6rem;"/>
        <label class="form-label">Amount</label>
        <input type="number" id="add-amount" class="form-control" placeholder="100" min="1" style="margin-bottom:0.75rem;"/>
        <button class="btn-primary-custom w-100" onclick="addBalance()">Add Credits</button>
        <div id="balance-alert" class="alert-custom"></div>
      </div>
    </div>

    <!-- New Order -->
    <div class="card-custom">
      <h5>Place New Order</h5>
      <div style="display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;">
        <div>
          <label class="form-label">Target URL / Link</label>
          <input type="url" id="order-link" class="form-control" placeholder="https://instagram.com/p/abc123"/>
        </div>
        <div style="min-width:100px;">
          <label class="form-label">Quantity</label>
          <input type="number" id="order-qty" class="form-control" placeholder="100" min="1"/>
        </div>
      </div>
      <div style="margin-top:0.75rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
        <button class="btn-primary-custom" onclick="placeOrder()">Place Order →</button>
        <span style="font-size:0.75rem;color:var(--muted);">Cost: 1 credit per unit</span>
      </div>
      <div id="order-alert" class="alert-custom"></div>
    </div>

    <!-- Orders List -->
    <div class="card-custom">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h5 style="margin:0;">Recent Orders</h5>
        <button class="btn-sm-custom" onclick="loadOrders()">↻ Refresh</button>
      </div>
      <div id="orders-container">
        <div class="empty-state">No orders yet.</div>
      </div>
    </div>

  </div><!-- /dashboard -->
</div><!-- /wrapper -->

<script>
let currentUserId = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  return res.json();
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  el.className = `alert-custom ${type === 'success' ? 'alert-success' : 'alert-danger'}`;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

async function doLogin() {
  const uid = document.getElementById('login-uid').value.trim();
  if (!uid) { showAlert('login-alert', 'Please enter a User ID.', 'error'); return; }

  const data = await api('/api/user', { method: 'POST', body: JSON.stringify({ user_id: uid }) });
  if (data.error) { showAlert('login-alert', data.error, 'error'); return; }

  currentUserId = uid;
  document.getElementById('chip-uid').textContent = uid;
  document.getElementById('user-chip').style.display = 'inline-flex';
  document.getElementById('logout-btn').style.display = 'inline-block';
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('balance-val').textContent = data.balance;
  loadOrders();
}

function logout() {
  currentUserId = null;
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('user-chip').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('login-uid').value = '';
}

async function refreshBalance() {
  if (!currentUserId) return;
  const data = await api(`/api/balance?user_id=${encodeURIComponent(currentUserId)}`);
  if (!data.error) document.getElementById('balance-val').textContent = data.balance;
}

async function addBalance() {
  const token  = document.getElementById('admin-token').value.trim();
  const amount = parseInt(document.getElementById('add-amount').value);
  if (!token) { showAlert('balance-alert', 'Admin token required.', 'error'); return; }
  if (!amount || amount <= 0) { showAlert('balance-alert', 'Enter a valid amount.', 'error'); return; }

  const data = await api('/api/admin/add-balance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: JSON.stringify({ user_id: currentUserId, amount })
  });
  if (data.error) { showAlert('balance-alert', data.error, 'error'); return; }
  showAlert('balance-alert', `Added! New balance: ${data.new_balance}`, 'success');
  document.getElementById('balance-val').textContent = data.new_balance;
  document.getElementById('add-amount').value = '';
}

async function placeOrder() {
  const link = document.getElementById('order-link').value.trim();
  const qty  = parseInt(document.getElementById('order-qty').value);
  if (!link) { showAlert('order-alert', 'Please enter a URL.', 'error'); return; }
  if (!qty || qty <= 0) { showAlert('order-alert', 'Enter a valid quantity.', 'error'); return; }

  const btn = document.querySelector('[onclick="placeOrder()"]');
  btn.innerHTML = '<span class="spinner"></span>Placing…';
  btn.disabled = true;

  const data = await api('/api/order', {
    method: 'POST',
    body: JSON.stringify({ user_id: currentUserId, link, qty })
  });

  btn.innerHTML = 'Place Order →';
  btn.disabled = false;

  if (data.error) { showAlert('order-alert', data.error, 'error'); return; }
  showAlert('order-alert', `Order placed! Provider ID: ${data.provider_order_id}. Cost: ${data.cost} credits.`, 'success');
  document.getElementById('order-link').value = '';
  document.getElementById('order-qty').value = '';
  refreshBalance();
  loadOrders();
}

async function loadOrders() {
  if (!currentUserId) return;
  const data = await api(`/api/orders?user_id=${encodeURIComponent(currentUserId)}`);
  const container = document.getElementById('orders-container');

  if (data.error || !data.orders || data.orders.length === 0) {
    container.innerHTML = '<div class="empty-state">No orders yet. Place your first order above!</div>';
    return;
  }

  const rows = data.orders.map(o => {
    const statusClass = {
      pending: 'status-pending', inprogress: 'status-inprogress',
      completed: 'status-completed', partial: 'status-partial'
    }[o.status?.toLowerCase()] || 'status-default';

    return `<tr>
      <td style="color:var(--muted);font-size:0.75rem;">#${o.id}</td>
      <td class="link-cell" title="${o.link}">${o.link}</td>
      <td>${o.qty}</td>
      <td><span class="status-badge ${statusClass}">${o.status}</span></td>
      <td style="color:var(--muted);font-size:0.72rem;">${o.provider_order_id || '—'}</td>
      <td><button class="btn-sm-custom" onclick="checkStatus(${o.id})">Check</button></td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="orders-table">
      <thead><tr>
        <th>ID</th><th>Link</th><th>Qty</th><th>Status</th><th>Provider ID</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function checkStatus(orderId) {
  const data = await api(`/api/order/status?order_id=${orderId}&user_id=${encodeURIComponent(currentUserId)}`);
  if (data.error) { alert('Error: ' + data.error); return; }
  alert(`Order #${orderId} Status: ${data.status}`);
  loadOrders();
}
</script>
</body>
</html>
